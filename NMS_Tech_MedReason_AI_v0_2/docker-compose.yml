services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nms-medreason-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medreason
      POSTGRES_PASSWORD: medreason_dev_password
      POSTGRES_DB: medreason
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medreason -d medreason"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - medreason_pgdata:/var/lib/postgresql/data
volumes:
  medreason_pgdata:
